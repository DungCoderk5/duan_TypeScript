<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Butcherman&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .login-container {
            display: flex;
            margin: 10px 0;
            font-family: 'Oswald', sans-serif;
        }

        .modal-content {
            max-width: 800px;
            width: 100%;
            background: #fff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            height: auto;
            margin: 0 auto;
            display: flex;
            align-items: center;
            /* justify-content: center; */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease-in-out;
            display: none;

        }

        .modal-content.active {
            opacity: 1;
            visibility: visible;
            z-index: 101;
            display: block;
            

        }

        .overlay2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        /* Overlay khi mở */
        .overlay2.active {
            opacity: 1;
            visibility: visible;
            z-index: 100;

        }

        .side-menu {
            padding: 20px;
            width: 30%;
            display: flex;
            flex-direction: column;
            text-align: left;
            border-right: 1px solid #e1e1e1;
        }

        .side-menu h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .side-menu a {
            display: block;
            margin: 5px 0;
            text-decoration: none;
            color: #333;
            background: rgba(0, 0, 0, 0.03);
            padding: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        .side-menu a:hover {
            color: red;
        }

        .side-menu a.active {
            font-weight: bold;
            color: red
        }


        .login-form {
            padding: 10px 40px;
            width: 70%;
            opacity: 0;
            visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        .login-form.active {
            opacity: 1;
            visibility: visible;
            position: relative;
            transition: all 0.5s ease;

        }

        .login-form h2 {
            margin: 10px 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .social-login {
            display: flex;
            justify-content: space-evenly;
            margin-top: 20px;
        }

        .social-login a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            padding: 10px 20px;
            color: white;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .facebook-test i,
        .google-test i {
            border-right: 1px solid white;
            font-size: 18px;
            background-color: #3b5998;
            padding: 10px 20px;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: white;
            display: flex;
            align-items: center;
        }

        .google-test i {
            background-color: #db4437 !important;
        }

        .facebook-test,
        .google-test {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<link rel="stylesheet" href="css/style.css">

<body>
    <header>
        <!-- Logo -->
        <img src="//bizweb.dktcdn.net/thumb/medium/100/493/370/themes/940719/assets/shop_logo_image.png?1713464283843"
            alt="Shoes Logo">

        <!-- Navigation -->
        <nav>
            <ul class="menu">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Thương hiệu</a>
                    <ul class="subnav" style="list-style: none;">

                    </ul>
                </li>
                <li><a href="product.html">Sản phẩm</a></li>
                <li><a href="#">Accessories - Phụ trang</a></li>
                <li><a href="#">Tin tức</a></li>
                <li><a href="#">Liên hệ</a></li>
                <li><a href="#">Giới thiệu</a></li>
            </ul>
        </nav>

        <!-- Header right (search + icons) -->
        <div class="header-right">
            <input type="text" placeholder="Tìm kiếm sản phẩm ..." id="animated-placeholder">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute;left: auto;right: 180px;"
                onclick="searchProduct()"></i>
            <div class="header-icons">
                <a href="#" onclick="opennguuu()"><i class="fa fa-user" ></i></a>
                <a href="#"><i class="fa fa-heart"></i><span class="icon-badge">0</span></a>
                <a href="#" onclick="openCart()"><i class="fa fa-shopping-cart"></i><span
                        class="icon-badge icon-badge1">0</span></a>
            </div>
        </div>
    </header>
    <div class="overlay2" onclick="closenguuuu()"></div>
    <div class="modal-content">
        <div class="login-container">
            <div class="side-menu">
                <img src="//bizweb.dktcdn.net/100/493/370/themes/940719/assets/shop_logo_image.png?1713464283843"
                    alt="">
                <a href="#" class="side-link active" data-hien="1">Đăng nhập</a>
                <a href="#" class="side-link" data-hien="2">Quên mật khẩu</a>
                <a href="#" class="side-link" data-hien="3">Đăng ký</a>
            </div>

            <div class="login-form active" data-hien="1">
                <h2>ĐĂNG NHẬP</h2>
                <form>
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" placeholder="Nhập email của bạn">
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu*</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu">
                    </div>
                    <div class="form-group">
                        <button type="submit">ĐĂNG NHẬP</button>
                    </div>
                </form>
            </div>

            <div class="login-form" data-hien="2">
                <h2>Quên mật khẩu</h2>
                <form>
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" placeholder="Nhập email của bạn">
                    </div>
                    <div class="form-group">
                        <button type="submit">GỬI</button>
                    </div>
                </form>
            </div>

            <div class="login-form" data-hien="3">
                <h2>ĐĂNG KÝ</h2>
                <form>
                    <div class="form-group">
                        <label for="ho">Họ của bạn*</label>
                        <input type="text" id="ho" placeholder="Nhập họ của bạn">
                    </div>
                    <div class="form-group">
                        <label for="ten">Tên của bạn*</label>
                        <input type="text" id="ten" placeholder="Nhập tên của bạn">
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại*</label>
                        <input type="number" id="phone" placeholder="Nhập số điện thoại">
                    </div>
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" placeholder="Nhập email của bạn">
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu*</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu">
                    </div>
                    <div class="form-group">
                        <button type="submit">ĐĂNG KÝ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const sideLinks = document.querySelectorAll('.side-link');
        const forms = document.querySelectorAll('.login-form');

        sideLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();

                // Xóa class active cho tất cả form và link
                sideLinks.forEach(item => item.classList.remove('active'));
                forms.forEach(form => form.classList.remove('active'));

                // Kích hoạt form và link được chọn
                link.classList.add('active');
                const hienIndex = link.dataset.hien;
                document.querySelector(`.login-form[data-hien="${hienIndex}"]`).classList.add('active');
            });
        });
        function opennguuu() {
            const modal = document.querySelector('.modal-content');
            const overlay = document.querySelector('.overlay2');

            // Hiển thị modal và overlay
            modal.classList.add('active');
            overlay.classList.add('active');
        }
        function closenguuuu() {
            const cartSidebar = document.querySelector('.modal-content');
            const overlay = document.querySelector('.overlay2');
            cartSidebar.classList.remove('active'); // Đóng giỏ hàng
            overlay.classList.remove('active');  // Ẩn overlay
        }
    </script>
</body>

</html>
