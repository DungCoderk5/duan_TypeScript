<div class="shop-sort-by">
    <label for="sort-select">Sắp xếp theo</label>
    <select id="sort-select">
        <option value="">Mặc định</option>
        <option value="name:asc">A → Z</option>
        <option value="name:desc">Z → A</option>
        <option value="price_min:asc">Giá tăng dần</option>
        <option value="price_min:desc">Giá giảm dần</option>
        <option value="created_on:desc">Hàng mới nhất</option>
        <option value="created_on:asc">Hàng cũ nhất</option>
    </select>
</div>
<script>
    document.getElementById("sort-select").addEventListener("change", function () {
        const sortOption = this.value;
        const productList = document.querySelector(".product-grid");
        const products = Array.from(document.querySelectorAll(".product-card"));

        // Sắp xếp sản phẩm dựa trên tùy chọn
        const sortedProducts = products.sort((a, b) => {
            const priceA = parseInt(a.getAttribute("data-price"));
            const priceB = parseInt(b.getAttribute("data-price"));
            const nameA = a.getAttribute("data-name").toLowerCase();
            const nameB = b.getAttribute("data-name").toLowerCase();
            const dateA = new Date(a.getAttribute("data-date"));
            const dateB = new Date(b.getAttribute("data-date"));

            switch (sortOption) {
                case "price_min:asc":
                    return priceA - priceB;
                case "price_min:desc":
                    return priceB - priceA;
                case "name:asc":
                    return nameA.localeCompare(nameB);
                case "name:desc":
                    return nameB.localeCompare(nameA);
                case "created_on:asc":
                    return dateA - dateB;
                case "created_on:desc":
                    return dateB - dateA;
                default:
                    return 0;
            }
        });

        // Cập nhật lại danh sách sản phẩm trên giao diện
        productList.innerHTML = "";
        sortedProducts.forEach((product) => productList.appendChild(product));
    });

</script>
