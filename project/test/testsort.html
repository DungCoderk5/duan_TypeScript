<script>
  document.addEventListener("DOMContentLoaded", () => {
  // Lấy tất cả các checkbox lọc
  const filterCheckboxes = document.querySelectorAll('input[type="checkbox"]');

  // Gắn sự kiện change cho checkbox
  filterCheckboxes.forEach((checkbox) => {
    checkbox.addEventListener("change", filterProducts);
  });

  function filterProducts() {
    const selectedFilters = {
      vendor: [],
      type: [],
      size: [],
      color: [],
      price: [],
    };

    // Lưu giá trị từ các checkbox đã chọn
    filterCheckboxes.forEach((checkbox) => {
      if (checkbox.checked) {
        const group = checkbox.dataset.group;
        selectedFilters[group].push(checkbox.value);
      }
    });

    // Lấy tất cả các sản phẩm
    const products = document.querySelectorAll(".product-card");

    // Lọc sản phẩm dựa trên giá trị đã chọn
    products.forEach((product) => {
      const matchesVendor = selectedFilters.vendor.length === 0 || selectedFilters.vendor.includes(product.dataset.name);
      const matchesPrice = selectedFilters.price.length === 0 || selectedFilters.price.some(priceRange => {
        const [operator, value] = parseFilterValue(priceRange);
        return evaluatePriceCondition(operator, product.dataset.price, value);
      });

      product.style.display = matchesVendor && matchesPrice ? "block" : "none";
    });
  }

  // Hàm phân tích giá trị lọc theo điều kiện
  function parseFilterValue(value) {
    const match = value.match(/([<>=]+)(\d+)/);
    return match ? [match[1], parseInt(match[2], 10)] : ["", 0];
  }

  // Kiểm tra điều kiện giá
  function evaluatePriceCondition(operator, productPrice, filterPrice) {
    const price = parseInt(productPrice, 10);
    switch (operator) {
      case "<": return price < filterPrice;
      case ">": return price > filterPrice;
      case "<=": return price <= filterPrice;
      case ">=": return price >= filterPrice;
      default: return false;
    }
  }
});


</script>
