<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm người dùng</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="sidebar">
        <h2>Quản Trị Viên</h2>
        <ul>
            <a href="../adminthuancss.html">
                <li>📊 Bảng Điều Khiển</li>
            </a>
            <a href="../admin_nguoi_dung.html">
                <li class="active">👤 Quản Lý Người Dùng</li>
            </a>
            <a href="../admin_thuong_hieu.htmll">
                <li>🏷️ Quản Lý Thương Hiệu</li>
            </a>
            <a href="../admin_san_pham.html">
                <li>📦 Quản Lý Sản Phẩm</li>
            </a>
            <a href="">
                <li>🛒 Quản Lý Đơn Hàng</li>
            </a>
            <a href="">
                <li>🎟️ Quản Lý Voucher</li>
            </a>
        </ul>
    </div>
    <div class="main-content">
        <h2>Thêm người dùng mới</h2>
        <form id="addUserForm" action="/san_pham" method="POST">
            <div class="form-group">
                <label for="name">Tên người dùng:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="role">Vai trò:</label>
                <select id="role" name="role">
                    <option value="admin">Quản trị viên</option>
                    <!-- <option value="customer">Khách hàng</option> -->
                </select>
            </div>

            <button type="submit">Thêm người dùng</button>
        </form>
    </div>
</body>
<script type="module">
    import {them_nguoi_dung} from '/js/admin_them.js';
    document.getElementById('addUserForm').addEventListener('submit', function (e) {
    e.preventDefault();  // Ngừng hành động mặc định của form (chuyển trang)

    // Lấy dữ liệu từ form
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const role = document.getElementById('role').value;
    const address = document.getElementById('address').value;

    // Lấy id địa chỉ tăng dần (ví dụ, lưu vào biến global hoặc lấy từ cơ sở dữ liệu nếu có)
    let addressId = 1;  // Mặc định bắt đầu từ 1

    // Nếu bạn có một cách để theo dõi id trước đó (ví dụ từ database hoặc session), bạn có thể cập nhật addressId ở đây

    // Tạo mảng địa chỉ theo định dạng yêu cầu
    const userData = {
        name: name,
        email: email,
        phone: phone,
        diachi: [
            {
                id: addressId,  // Tăng id mỗi lần thêm địa chỉ
                address: address
            }
        ],
        role: role
    };

    // Gọi hàm them_nguoi_dung để gửi dữ liệu
    them_nguoi_dung(userData);
});

</script>

</html>
